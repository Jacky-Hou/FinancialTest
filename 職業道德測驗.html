/* ===== 狀態 ===== */
const state = {
  screen: 'setup',      // setup | quiz | result
  pool: [],              // 本次測驗的題目陣列
  order: [],             // 選項洗牌後的順序 index (每題4個)
  idx: 0,                // 目前第幾題 (0-based)
  selected: null,        // 目前題目已選的選項 index(原始 1-4)
  pending: null,         // 已點選但尚未送出的選項 display pos(未送出前可改選)
  answers: [],           // 依題目索引存放作答紀錄，未作答為 null，{num, correct, chosenNum,...}
  mode: 'sequential',     // 'random' | 'sequential'
  range: null,           // 'all' | 'r1'~'r6' | null(自訂範圍,對應不到任一按鈕)
  rangeMin: 1,           // 拖曳滑桿-起始題號
  rangeMax: QUIZ_DATA.length // 拖曳滑桿-結束題號
};

let scrollMode = 'bottom'; // 'bottom' | 'top' —— 顯示新題目時用top，其餘(含確定送出)預設bottom

function getFilteredData() {
  return QUIZ_DATA.filter(q => q.num >= state.rangeMin && q.num <= state.rangeMax);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  const filtered = getFilteredData();
  const pool = state.mode === 'random' ? shuffle(filtered) : filtered.slice();
  // 一律出「起始題號~結束題號」範圍內的全部題目
  state.pool = pool.map(q => {
    // 建立選項洗牌對照: optOrder 是長度4的陣列，內容為原始 index(0-3)
    const optOrder = shuffle([0,1,2,3]);
    return { ...q, optOrder };
  });
  state.idx = 0;
  state.selected = null;
  state.pending = null;
  state.answers = new Array(state.pool.length).fill(null);
  state.screen = 'quiz';
  scrollMode = 'top';
  render();
}

let optionClickLock = false; // iOS Safari 修正：防止 ghost click 在極短時間內重複觸發選項點擊
function selectOption(displayPos) {
  if (optionClickLock) return; // 鎖定期間內的重複點擊(常為ghost click)一律忽略
  optionClickLock = true;
  setTimeout(() => { optionClickLock = false; }, 400);

  const q = state.pool[state.idx];
  const originalIdx = q.optOrder[displayPos]; // 0-based 原始選項index
  const chosenNum = originalIdx + 1; // 1-4
  const correct = chosenNum === q.answer;
  state.pending = displayPos;
  state.selected = displayPos;
  state.answers[state.idx] = { num: q.num, stem: q.stem, options: q.options, optOrder: q.optOrder,
                                answer: q.answer, chosenNum, correct, reason: q.reason };
  render();
}

function jumpToQuestion(index) {
  state.idx = index;
  const ans = state.answers[index];
  state.selected = ans ? state.pool[index].optOrder.indexOf(ans.chosenNum - 1) : null;
  state.pending = state.selected;
  scrollMode = 'top';
  render();
}

function prevQuestion() {
  if (state.idx <= 0) return; // 已在第一題，無法再上一頁
  state.idx -= 1;
  const ans = state.answers[state.idx];
  state.selected = ans ? state.pool[state.idx].optOrder.indexOf(ans.chosenNum - 1) : null;
  state.pending = state.selected;
  scrollMode = 'top';
  render();
}

function nextQuestion() {
  if (!state.answers[state.idx]) return; // 本題尚未送出作答，不可前進
  if (state.idx < state.pool.length - 1) {
    state.idx += 1;
    const ans = state.answers[state.idx];
    state.selected = ans ? state.pool[state.idx].optOrder.indexOf(ans.chosenNum - 1) : null;
    state.pending = state.selected;
    scrollMode = 'top';
    render();
  } else {
    state.screen = 'result';
    render();
  }
}

function restart() {
  state.screen = 'setup';
  render();
}

function goHome() {
  state.screen = 'setup';
  state.pool = [];
  state.idx = 0;
  state.selected = null;
  state.pending = null;
  state.answers = [];
  render();
}

function reviewMissed() {
  state.screen = 'review';
  render();
}

function backToResult() {
  state.screen = 'result';
  render();
}

/* ===== 畫面渲染 ===== */
function render() {
  // iOS Safari 修正：click 事件處理中若同步整段替換 innerHTML，
  // WebKit 可能將同一次點擊的 ghost click 誤觸到新DOM(常誤觸到「正確答案」選項)。
  // 延後到下一個 tick 執行，讓本次點擊事件先完整結束再換DOM。
  setTimeout(_renderNow, 0);
}
function _renderNow() {
  const app = document.getElementById('app');
  if (state.screen === 'setup') {
    app.innerHTML = renderSetup();
    markMode();
    markRange();
  }
  else if (state.screen === 'quiz') app.innerHTML = renderQuiz();
  else if (state.screen === 'result') app.innerHTML = renderResult();
  else if (state.screen === 'review') app.innerHTML = renderReview();
  // 修正 iOS Safari 偶發不重繪選項顏色(紅/綠框)的問題：強制瀏覽器完成兩次繪製
  requestAnimationFrame(() => { requestAnimationFrame(() => {}); });
  if (state.screen === 'quiz' || state.screen === 'setup') {
    const mode = scrollMode;
    setTimeout(() => {
      if (state.screen === 'quiz' && mode === 'top') {
        const card = document.getElementById('quiz-card');
        if (card) card.scrollIntoView({block:'start', behavior:'auto'});
        else window.scrollTo({top:0, behavior:'auto'});
      } else {
        window.scrollTo({top: document.body.scrollHeight, behavior:'auto'});
      }
    }, 60);
    scrollMode = 'bottom'; // 用畢重置為預設(確定送出等其他動作維持捲到最下方)
  } else {
    window.scrollTo({top:0, behavior:'auto'});
  }
}

function renderSetup() {
  const total = QUIZ_DATA.length;
  const filteredLen = getFilteredData().length;
  const rangeChips = RANGES.map(r => `
    <button onclick="setRange('${r.key}')" id="range-${r.key}"
      class="range-btn px-3 py-2 rounded-lg border-2 text-sm font-medium transition">
      ${r.label}
    </button>`).join('');
  const rangeLabel = state.range ? (RANGES.find(r => r.key === state.range) || {}).label : null;

  return `
  <div class="fade-in">
    <div class="text-center mb-6 sm:mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-indigo-600 text-white mb-3 shadow-lg shadow-indigo-200">
        <i class="fa-solid fa-scale-balanced text-xl sm:text-2xl"></i>
      </div>
      <h1 class="text-xl sm:text-2xl font-bold text-gray-900">職業道德 測驗</h1>
      <p class="text-gray-500 mt-1 text-xs sm:text-sm">題庫共 ${total} 題，選擇模式後開始作答</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 sm:p-6 space-y-6">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">題號範圍</label>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
          ${rangeChips}
        </div>
        <p class="text-xs text-gray-400 mt-1.5">
          ${rangeLabel
            ? `已選範圍：<span class="font-semibold text-indigo-600">${rangeLabel}</span>，共 <span class="font-semibold text-gray-600">${filteredLen}</span> 題（再按一次可取消）`
            : `尚未選擇範圍，預設為全部 <span class="font-semibold text-gray-600">${total}</span> 題`}
        </p>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">出題方式</label>
        <div class="grid grid-cols-2 gap-3">
          <button onclick="setMode('sequential')" id="mode-sequential"
            class="mode-btn px-4 py-3 rounded-xl border-2 text-base font-medium transition">
            <i class="fa-solid fa-list-ol mr-1"></i> 依題號順序
          </button>
          <button onclick="setMode('random')" id="mode-random"
            class="mode-btn px-4 py-3 rounded-xl border-2 text-base font-medium transition">
            <i class="fa-solid fa-shuffle mr-1"></i> 隨機出題
          </button>
        </div>
        <p class="text-xs text-gray-400 mt-1.5">將在「題號範圍」篩選出的題目中，依此方式出題</p>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          起訖題號（共 <span id="range-count-label" class="font-semibold text-gray-600">${filteredLen}</span> 題）
        </label>
        <div class="grid grid-cols-2 gap-3 mb-3">
          <div>
            <input type="number" min="1" max="${total}" step="1" value="${state.rangeMin}" id="range-min-input"
              onchange="setRangeMinInput(this.value)"
              class="w-full border-2 border-gray-200 rounded-lg px-3 py-2 text-sm text-center font-semibold text-indigo-600 focus:border-indigo-500 focus:outline-none">
          </div>
          <div>
            <input type="number" min="1" max="${total}" step="1" value="${state.rangeMax}" id="range-max-input"
              onchange="setRangeMaxInput(this.value)"
              class="w-full border-2 border-gray-200 rounded-lg px-3 py-2 text-sm text-center font-semibold text-indigo-600 focus:border-indigo-500 focus:outline-none">
          </div>
        </div>
        <div class="dual-range">
          <div class="track-bg"></div>
          <div class="track-fill" id="track-fill"
            style="left:${(state.rangeMin - 1) / (total - 1) * 100}%; width:${(state.rangeMax - state.rangeMin) / (total - 1) * 100}%;"></div>
          <input type="range" min="1" max="${total}" step="1" value="${state.rangeMin}"
            oninput="dragRangeLive('min', this.value)" onchange="dragRangeCommit('min', this.value)"
            id="range-min-slider">
          <input type="range" min="1" max="${total}" step="1" value="${state.rangeMax}"
            oninput="dragRangeLive('max', this.value)" onchange="dragRangeCommit('max', this.value)"
            id="range-max-slider">
        </div>
        <div class="flex justify-between text-xs text-gray-400 mt-1">
          <span>1</span><span>${total}</span>
        </div>
        <p class="text-xs text-gray-400 mt-1.5">拖曳把手或直接輸入題號，會自動對應上方按鈕（或顯示為自訂範圍）</p>
      </div>

      <button onclick="startQuiz()"
        class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base transition shadow-md shadow-indigo-200">
        <i class="fa-solid fa-play mr-1.5"></i>開始測驗
      </button>
    </div>
  </div>
  `;
}

function setMode(m) {
  state.mode = m;
  render();
}
function updateRangeLiveDom() {
  // 拖曳過程中只更新輸入框/滑桿填色，不重新渲染，避免拖曳卡頓
  const total = QUIZ_DATA.length;
  const minInput = document.getElementById('range-min-input');
  const maxInput = document.getElementById('range-max-input');
  const countEl = document.getElementById('range-count-label');
  const fill = document.getElementById('track-fill');
  if (minInput) minInput.value = state.rangeMin;
  if (maxInput) maxInput.value = state.rangeMax;
  if (countEl) countEl.textContent = state.rangeMax - state.rangeMin + 1;
  if (fill) {
    fill.style.left = ((state.rangeMin - 1) / (total - 1) * 100) + '%';
    fill.style.width = ((state.rangeMax - state.rangeMin) / (total - 1) * 100) + '%';
  }
}
function syncRangeMatch() {
  // 比對目前起訖題號是否剛好對應某個題號範圍按鈕
  const total = QUIZ_DATA.length;
  const match = RANGES.find(r => r.min === state.rangeMin && Math.min(r.max, total) === state.rangeMax);
  state.range = match ? match.key : null;
}
function dragRangeLive(which, v) {
  v = parseInt(v);
  if (which === 'min') {
    if (v > state.rangeMax) { v = state.rangeMax; document.getElementById('range-min-slider').value = v; }
    state.rangeMin = v;
  } else {
    if (v < state.rangeMin) { v = state.rangeMin; document.getElementById('range-max-slider').value = v; }
    state.rangeMax = v;
  }
  updateRangeLiveDom();
}
function dragRangeCommit(which, v) {
  dragRangeLive(which, v);
  syncRangeMatch(); // 放開滑鼠/手指後，比對是否剛好對應某個題號範圍按鈕
  render();
}
function setRangeMinInput(v) {
  const total = QUIZ_DATA.length;
  let n = parseInt(v);
  if (isNaN(n)) n = state.rangeMin;
  n = Math.max(1, Math.min(n, total));
  if (n > state.rangeMax) n = state.rangeMax;
  state.rangeMin = n;
  syncRangeMatch();
  render();
}
function setRangeMaxInput(v) {
  const total = QUIZ_DATA.length;
  let n = parseInt(v);
  if (isNaN(n)) n = state.rangeMax;
  n = Math.max(1, Math.min(n, total));
  if (n < state.rangeMin) n = state.rangeMin;
  state.rangeMax = n;
  syncRangeMatch();
  render();
}
function setRange(r) {
  const total = QUIZ_DATA.length;
  if (state.range === r) {
    // 再按一次 = 取消，回到全部範圍
    state.range = null;
    state.rangeMin = 1;
    state.rangeMax = total;
  } else {
    const rg = RANGES.find(x => x.key === r);
    state.range = r;
    state.rangeMin = rg.min;
    state.rangeMax = Math.min(rg.max, total);
  }
  render();
}
function markRange() {
  RANGES.forEach(r => {
    const el = document.getElementById('range-' + r.key);
    if (!el) return;
    if (r.key === state.range) {
      el.className = 'range-btn px-3 py-2 rounded-lg border-2 text-sm font-medium transition border-indigo-600 bg-indigo-50 text-indigo-700';
    } else {
      el.className = 'range-btn px-3 py-2 rounded-lg border-2 text-sm font-medium transition border-gray-200 text-gray-600 hover:border-gray-300';
    }
  });
}
function markMode() {
  ['random','sequential'].forEach(m => {
    const el = document.getElementById('mode-' + m);
    if (!el) return;
    if (m === state.mode) {
      el.className = 'mode-btn px-4 py-3 rounded-xl border-2 text-base font-medium transition border-indigo-600 bg-indigo-50 text-indigo-700';
    } else {
      el.className = 'mode-btn px-4 py-3 rounded-xl border-2 text-base font-medium transition border-gray-200 text-gray-600 hover:border-gray-300';
    }
  });
}

function renderQuiz() {
  const q = state.pool[state.idx];
  const progress = Math.round(((state.idx) / state.pool.length) * 100);
  const ansRecord = state.answers[state.idx];
  const answered = !!ansRecord; // 該題是否已「送出」作答(非僅暫選)
  const lastAnswer = ansRecord;

  const poolNums = state.pool.map(x => x.num);
  const numMin = Math.min(...poolNums);
  const numMax = Math.max(...poolNums);

  const optionsHtml = q.optOrder.map((origIdx, pos) => {
    const label = ['A','B','C','D'][pos];
    const text = q.options[origIdx];
    let cls = 'border-gray-200 hover:border-indigo-300 hover:bg-indigo-50/50 cursor-pointer';
    let icon = '';
    if (answered) {
      const isCorrectOpt = (origIdx + 1) === q.answer;
      const isChosen = pos === state.selected;
      if (isCorrectOpt) {
        cls = 'border-green-500 bg-green-50';
        icon = '<i class="fa-solid fa-circle-check" style="color:#10b981"></i>';
      } else if (isChosen && !isCorrectOpt) {
        cls = 'border-red-500 bg-red-50';
        icon = '<i class="fa-solid fa-circle-xmark" style="color:#f43f5e"></i>';
      } else {
        cls = 'border-gray-200 opacity-60';
      }
    } else if (state.pending === pos) {
      // 尚未送出，僅為「暫選」狀態，以外框顏色標示已勾選但未確認
      cls = 'border-indigo-500 bg-indigo-50';
      icon = '<i class="fa-solid fa-circle-dot text-indigo-500"></i>';
    }
    return `
      <button onclick="selectOption(${pos})"
        class="option-btn w-full text-left px-3 py-2 rounded-xl border-2 flex items-start gap-2 transition ${cls}">
        <span class="flex-shrink-0 w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center text-xs font-bold text-gray-500">${label}</span>
        <span class="flex-1 text-base font-light leading-snug pt-0.5">${escapeHtml(text)}</span>
        <span class="flex-shrink-0 pt-1">${icon}</span>
      </button>`;
  }).join('');

  const answeredList = state.answers.filter(a => a);
  const correctCount = answeredList.filter(a => a.correct).length;
  const correctItems = state.pool.map((item, i) => ({ num: item.num, idx: i, ans: state.answers[i] })).filter(x => x.ans && x.ans.correct);
  const wrongItems = state.pool.map((item, i) => ({ num: item.num, idx: i, ans: state.answers[i] })).filter(x => x.ans && !x.ans.correct);

  const trackerHtml = state.pool.map((item, i) => {
    const ans = state.answers[i];
    let cls, inner;
    if (i === state.idx) {
      cls = 'bg-indigo-600 text-white ring-2 ring-indigo-300';
      inner = item.num;
    } else if (ans && ans.correct) {
      cls = 'bg-green-100 text-green-700';
      inner = '<i class="fa-solid fa-check" style="color:#10b981"></i>';
    } else if (ans && !ans.correct) {
      cls = 'bg-red-100 text-red-700';
      inner = '<i class="fa-solid fa-xmark" style="color:#f43f5e"></i>';
    } else {
      cls = 'bg-gray-100 text-gray-400';
      inner = item.num;
    }
    return `<span class="flex-shrink-0 w-7 h-7 rounded-lg flex items-center justify-center text-[10px] font-bold ${cls}">${inner}</span>`;
  }).join('');

  return `
  <div class="fade-in">
    <div class="flex items-center justify-between text-sm text-gray-500 mb-2">
      <div class="flex items-center gap-3">
        <button onclick="goHome()" class="text-gray-400 hover:text-indigo-600 transition" title="返回首頁">
          <i class="fa-solid fa-house"></i>
        </button>
        <button onclick="prevQuestion()" ${state.idx === 0 ? 'disabled' : ''}
          class="text-gray-400 hover:text-indigo-600 transition disabled:opacity-30 disabled:cursor-not-allowed" title="上一題">
          <i class="fa-solid fa-arrow-left"></i> 上一題
        </button>
      </div>
      <span>第 ${state.idx + 1} / ${state.pool.length} 題</span>
      <span><i class="fa-solid fa-check text-green-500 mr-1"></i>${correctCount} 答對</span>
    </div>
    <div class="w-full h-2 bg-gray-200 rounded-full mb-3 overflow-hidden">
      <div class="h-full bg-indigo-600 transition-all duration-300" style="width:${progress}%"></div>
    </div>
    <p class="text-xs text-gray-400 mb-2 flex flex-wrap gap-x-2 gap-y-0.5">
      <span>本次題號範圍：<span class="font-semibold text-gray-600">${numMin}~${numMax}</span></span>
      <span>目前作答：<span class="font-semibold text-indigo-600">第${q.num}題</span></span>
    </p>
    <div class="flex gap-1 overflow-x-auto pb-1 mb-3" style="scrollbar-width:thin;">
      ${trackerHtml}
    </div>

    ${state.answers.length > 0 ? `
    <div class="bg-white rounded-xl border border-gray-200 p-3 mb-6 text-xs space-y-1.5 break-words">
      <p><i class="fa-solid fa-circle-check mr-1" style="color:#10b981"></i><span class="font-semibold text-gray-600">答對題號：</span>${correctItems.length ? correctItems.map(x => `<a href="javascript:void(0)" onclick="jumpToQuestion(${x.idx})" class="text-green-600 font-medium underline hover:text-green-700">${x.num}</a>`).join('、') : '<span class="text-gray-300">尚無</span>'}</p>
      <p><i class="fa-solid fa-circle-xmark mr-1" style="color:#f43f5e"></i><span class="font-semibold text-gray-600">答錯題號：</span>${wrongItems.length ? wrongItems.map(x => `<a href="javascript:void(0)" onclick="jumpToQuestion(${x.idx})" class="text-red-500 font-medium underline hover:text-red-600">${x.num}</a>`).join('、') : '<span class="text-gray-300">尚無</span>'}</p>
    </div>
    ` : ''}

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 sm:p-6" id="quiz-card">
      <div class="mb-2">
        <span class="inline-block text-xs font-bold text-white bg-indigo-600 rounded-full px-2 py-1">題${q.num}</span>
      </div>
      <h2 class="text-lg font-light text-gray-900 leading-snug mb-5">${escapeHtml(q.stem)}</h2>

      <div class="space-y-2">
        ${optionsHtml}
      </div>

      ${answered && !lastAnswer.correct ? `
      <div class="mt-3 p-3 rounded-lg bg-red-50 border border-red-100 text-red-700 text-sm leading-relaxed">
        <i class="fa-solid fa-lightbulb mr-1"></i><span class="font-semibold">解析：</span>${escapeHtml(lastAnswer.reason)}
      </div>` : ''}

      ${!answered ? (state.idx > 0 ? `
      <div class="mt-5">
        <button onclick="prevQuestion()" class="w-full py-3 rounded-xl border border-gray-200 text-gray-600 hover:bg-gray-50 font-bold transition">
          <i class="fa-solid fa-arrow-left mr-1"></i>上一題
        </button>
      </div>
      ` : '') : `
      <div class="mt-4 grid ${state.idx > 0 ? 'grid-cols-2' : 'grid-cols-1'} gap-3">
        ${state.idx > 0 ? `
        <button onclick="prevQuestion()" class="py-3 rounded-xl border border-gray-200 text-gray-600 hover:bg-gray-50 font-bold transition">
          <i class="fa-solid fa-arrow-left mr-1"></i>上一題
        </button>` : ''}
        <button onclick="nextQuestion()" class="py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold transition">
          ${state.idx < state.pool.length - 1 ? '下一題 <i class="fa-solid fa-arrow-right ml-1"></i>' : '查看結果 <i class="fa-solid fa-flag-checkered ml-1"></i>'}
        </button>
      </div>
      `}
    </div>
  </div>
  `;
}

function renderResult() {
  const total = state.answers.length;
  const correct = state.answers.filter(a => a.correct).length;
  const pct = Math.round((correct / total) * 100);
  const wrongList = state.answers.filter(a => !a.correct);
  const wrongCount = wrongList.length;
  let ring = pct >= 80 ? 'text-green-500' : pct >= 60 ? 'text-yellow-500' : 'text-red-500';
  let msg = pct >= 80 ? '表現優異！' : pct >= 60 ? '還不錯，再加把勁！' : '需要多加練習喔！';

  const wrongChips = wrongList.map(a =>
    `<span class="inline-block px-2.5 py-1 rounded-lg bg-red-50 text-red-600 text-xs font-bold">第${a.num}題</span>`
  ).join('');

  return `
  <div class="fade-in text-center">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 sm:p-8">
      <div class="w-24 h-24 sm:w-28 sm:h-28 mx-auto rounded-full border-8 border-gray-100 flex items-center justify-center mb-4 relative">
        <span class="text-2xl sm:text-3xl font-extrabold ${ring}">${pct}%</span>
      </div>
      <h2 class="text-lg sm:text-xl font-bold text-gray-900 mb-1">${msg}</h2>
      <p class="text-gray-500 text-sm mb-4">共 ${total} 題，答對 <span class="font-bold text-green-600">${correct}</span> 題，答錯 <span class="font-bold text-red-500">${wrongCount}</span> 題</p>

      ${wrongCount > 0 ? `
      <div class="mb-6 text-left">
        <p class="text-xs font-semibold text-gray-400 mb-2">答錯題號</p>
        <div class="flex flex-wrap gap-1.5">${wrongChips}</div>
      </div>` : ''}

      <div class="grid grid-cols-2 gap-3 mb-3">
        ${wrongCount > 0 ? `
        <button onclick="reviewMissed()" class="py-3 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold text-sm transition">
          <i class="fa-solid fa-magnifying-glass mr-1"></i>檢視錯題
        </button>` : `<button disabled class="py-3 rounded-xl bg-gray-50 text-gray-300 font-semibold text-sm">全對，無錯題</button>`}
        <button onclick="restart()" class="py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm transition">
          <i class="fa-solid fa-rotate-right mr-1"></i>重新測驗
        </button>
      </div>
      <button onclick="goHome()" class="w-full py-2.5 rounded-xl border border-gray-200 text-gray-500 hover:bg-gray-50 font-semibold text-sm transition">
        <i class="fa-solid fa-house mr-1"></i>返回首頁
      </button>
    </div>
  </div>
  `;
}

function renderReview() {
  const wrong = state.answers.filter(a => !a.correct);
  const items = wrong.map(a => {
    const optsHtml = a.optOrder.map((origIdx, pos) => {
      const label = ['A','B','C','D'][pos];
      const isCorrectOpt = (origIdx + 1) === a.answer;
      const isChosen = (origIdx + 1) === a.chosenNum;
      let cls = 'border-gray-200';
      let tag = '';
      if (isCorrectOpt) { cls = 'border-green-500 bg-green-50'; tag = '<span class="text-xs font-bold text-green-600 ml-1">(正解)</span>'; }
      else if (isChosen) { cls = 'border-red-400 bg-red-50'; tag = '<span class="text-xs font-bold text-red-500 ml-1">(你的答案)</span>'; }
      return `<div class="px-3 py-2 rounded-lg border ${cls} text-base flex items-start gap-2">
                <span class="font-bold text-gray-400">${label}</span>
                <span class="flex-1">${escapeHtml(a.options[origIdx])}${tag}</span>
              </div>`;
    }).join('');
    return `
    <div class="bg-white rounded-2xl border border-gray-200 p-4 sm:p-5">
      <div class="flex items-start gap-2 mb-3">
        <span class="flex-shrink-0 text-xs font-bold text-white bg-red-500 rounded-full px-2 py-1">題${a.num}</span>
        <h3 class="text-sm font-semibold text-gray-900 leading-relaxed">${escapeHtml(a.stem)}</h3>
      </div>
      <div class="space-y-2">${optsHtml}</div>
      ${a.reason ? `<div class="mt-3 p-3 rounded-lg bg-red-50 text-red-600 text-sm leading-relaxed">${escapeHtml(a.reason)}</div>` : ''}
    </div>`;
  }).join('');

  return `
  <div class="fade-in">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold text-gray-900"><i class="fa-solid fa-magnifying-glass text-red-500 mr-1"></i>錯題檢視 (${wrong.length})</h2>
      <button onclick="backToResult()" class="text-sm text-indigo-600 font-semibold"><i class="fa-solid fa-arrow-left mr-1"></i>返回</button>
    </div>
    <div class="space-y-4 mb-6">${items}</div>
    <div class="grid grid-cols-2 gap-3">
      <button onclick="goHome()" class="py-3 rounded-xl border border-gray-200 text-gray-500 hover:bg-gray-50 font-semibold text-sm transition">
        <i class="fa-solid fa-house mr-1"></i>返回首頁
      </button>
      <button onclick="restart()" class="py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm transition">
        <i class="fa-solid fa-rotate-right mr-1"></i>重新測驗
      </button>
    </div>
  </div>
  `;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

render();
</script>
</body>
</html>
